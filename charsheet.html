<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色卡 - 無限流TRPG3.0</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap');

  /* ===== 變數設定（與 index.html 同步）===== */
  :root {
    --bg: #faf6f0;
    --panel: #f0e8dc;
    --card: #fffdf9;
    --accent: #c67b47;
    --accent-soft: #c67b4722;
    --accent-dim: #a8623a;
    --text: #4a3728;
    --text-dim: #9a8575;
    --border: #ddd0c0;
    --ok: #4f7a3a;
    --warn: #b5562f;
    --mark: #ffe08a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-padding-top: 64px; }
  body {
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ===== 頂部列 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    height: 52px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; padding: 0 16px;
  }
  .topbar-title { font-family: 'ZCOOL QingKe HuangYou', sans-serif; font-size: 1.25em; color: var(--accent); letter-spacing: 2px; white-space: nowrap; text-decoration: none; }
  .topbar-sub { color: var(--text-dim); white-space: nowrap; }
  .spacer { flex: 1; }
  .btn {
    padding: 6px 14px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--accent); background: transparent; color: var(--accent); transition: background .2s;
  }
  .btn:hover { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dim); }
  .btn.small { padding: 2px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: wait; }

  /* ===== 版面 ===== */
  .layout { max-width: 1240px; margin: 0 auto; padding: 20px 16px 80px; display: grid; grid-template-columns: 150px 1fr; gap: 24px; }
  nav.toc { position: sticky; top: 72px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
  nav.toc a { color: var(--text); text-decoration: none; padding: 5px 10px; border-radius: 6px; border-left: 3px solid transparent; }
  nav.toc a:hover { background: var(--accent-soft); border-left-color: var(--accent); }
  main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }

  section.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px 18px; }
  section.card > h2 { font-size: 18px; font-weight: 900; color: var(--accent); margin-bottom: 4px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  section.card > h2 small { font-size: 12px; font-weight: 400; color: var(--text-dim); }
  h3 { font-size: 15px; font-weight: 700; margin: 16px 0 6px; }
  .hint { color: var(--text-dim); font-size: 12px; margin-bottom: 10px; }
  .msg { padding: 6px 10px; border-radius: 6px; margin: 8px 0 10px; font-size: 13px; background: var(--panel); border-left: 3px solid var(--text-dim); }
  .msg.ok { border-left-color: var(--ok); color: var(--ok); }
  .msg.warn { border-left-color: var(--warn); color: var(--warn); }

  /* 表單 */
  .grid { display: grid; gap: 10px 14px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .grid .wide { grid-column: 1 / -1; }
  label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-dim); }
  input[type=text], input[type=number], select, textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; background: #fff; padding: 5px 8px;
    color: var(--text); font-size: 14px; outline: none; transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 64px; }
  input[type=number] { text-align: center; padding: 4px 2px; -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button { display: none; }

  /* 表格 */
  .tw { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.t th { font-weight: 500; color: var(--text-dim); font-size: 12px; padding: 4px 3px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--border); }
  table.t td { padding: 3px; border-bottom: 1px solid #efe6da; text-align: center; vertical-align: middle; }
  table.t td.l, table.t th.l { text-align: left; }
  table.t td.grp { color: var(--accent); font-weight: 700; writing-mode: vertical-rl; letter-spacing: 4px; width: 26px; border-right: 1px solid var(--border); }
  table.t td.nm { font-weight: 500; white-space: nowrap; text-align: left; padding-left: 6px; }
  table.t input[type=number] { width: 46px; }
  table.t input[type=text] { min-width: 120px; }
  table.t td.nm input[type=text] { min-width: 0; width: 96px; margin-left: 2px; }
  table.t .sum { font-weight: 700; color: var(--accent-dim); min-width: 36px; }
  table.t .calc { color: var(--text); min-width: 32px; }
  table.t tr:hover td { background: #fbf4ea; }
  .col-sep { border-left: 1px solid var(--border); }
  .bad { color: var(--warn) !important; }

  /* 缺陷/天賦清單 */
  .slots { display: flex; flex-direction: column; gap: 8px; }
  .slot { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 6px 8px; align-items: start; padding: 8px; border: 1px solid #efe6da; border-radius: 8px; background: #fff; }
  .slot .eff { grid-column: 1 / -1; font-size: 12px; color: var(--text-dim); white-space: pre-wrap; max-height: 7.5em; overflow: auto; }
  .slot .eff:empty { display: none; }
  .pts { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 10px; }
  .pts b { color: var(--accent-dim); font-size: 16px; }

  /* 專長 */
  .feats { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 12px; }
  .feat { display: grid; grid-template-columns: 1fr auto 52px 22px; gap: 4px; align-items: center; }
  .feat .clr { position: static; }
  .slot.quirk { grid-template-columns: 1fr 2fr; }

  /* 清空按鈕 */
  .slot, .enh-card { position: relative; }
  .clr { position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border);
    background: #fff; color: var(--text-dim); font-size: 11px; line-height: 1; cursor: pointer; opacity: .55; transition: opacity .15s, color .15s; }
  .slot:hover .clr, .enh-card:hover .clr, .feat:hover .clr, .clr:focus-visible { opacity: 1; }
  .clr:hover { color: var(--warn); border-color: var(--warn); }
  @media (hover: none) { .clr { opacity: 1; } }

  /* 強化能力 */
  .enh { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .enh-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: #fff; display: flex; flex-direction: column; gap: 6px; }
  .enh-card h4 { font-size: 14px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
  .pick { display: flex; gap: 4px; }
  .pick input { flex: 1; min-width: 0; }
  .pick .go { display: inline-flex; align-items: center; padding: 0 6px; color: var(--accent); text-decoration: none; font-size: 15px; }
  .pick .go[hidden] { display: none; }
  .enh-card textarea { min-height: 96px; font-size: 13px; }

  /* ===== 資源選擇器 ===== */
  .modal { position: fixed; inset: 0; z-index: 100; background: rgba(40, 28, 18, .45); display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal.open { display: flex; }
  .picker { width: min(1100px, 100%); height: min(760px, 100%); background: var(--bg); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .pk-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .pk-head h3 { margin: 0; color: var(--accent); white-space: nowrap; }
  .pk-search { flex: 1 1 220px; display: flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--border); border-radius: 8px; padding: 0 10px; }
  .pk-search:focus-within { border-color: var(--accent); }
  .pk-search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 7px 0; font-size: 15px; }
  .seg { display: inline-flex; border: 1px solid var(--accent); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--accent); padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .pk-cat { width: auto; max-width: 180px; font-size: 13px; padding: 4px 6px; }
  .picker:not(.listmode) .pk-cat, .picker.listmode #pkMode, .picker.listmode .pk-scope { display: none; }
  .pk-scope { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer; }
  .pk-close { border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--text-dim); padding: 0 4px; }
  .pk-body { flex: 1; display: grid; grid-template-columns: minmax(260px, 38%) 1fr; min-height: 0; }
  .pk-list { border-right: 1px solid var(--border); overflow: auto; display: flex; flex-direction: column; }
  .crumbs { padding: 8px 12px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 2px; align-items: center; position: sticky; top: 0; background: var(--bg); }
  .crumbs a { color: var(--accent); cursor: pointer; }
  .pk-items { list-style: none; }
  .pk-items li { padding: 7px 12px; cursor: pointer; border-bottom: 1px solid #efe6da; display: flex; gap: 8px; align-items: baseline; }
  .pk-items li:hover { background: var(--accent-soft); }
  .pk-items li.sel { background: var(--accent); color: #fff; }
  .pk-items li.sel .p, .pk-items li.sel .c { color: #fff; }
  .pk-items .ic { flex: none; width: 14px; color: var(--text-dim); }
  .pk-items li.whole { color: var(--accent); font-weight: 700; background: var(--accent-soft); }
  .pk-items .nm { flex: 1; min-width: 0; }
  .pk-items .p { display: block; font-size: 11px; color: var(--text-dim); }
  .pk-items .c { color: var(--text-dim); font-size: 11px; }
  .pk-info { padding: 8px 12px; font-size: 12px; color: var(--text-dim); }
  .pk-prev { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pk-prev iframe { flex: 1; border: 0; width: 100%; background: var(--bg); }
  .pk-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); padding: 20px; text-align: center; }
  .pk-foot { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--panel); }
  .pk-foot .chosen { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }

  /* 建卡模式 */
  body.create .adv { display: none !important; }
  body:not(.create) .create-only { display: none !important; }
  body.create th.mark { color: var(--accent); font-weight: 700; }
  input.over { border-color: var(--warn) !important; background: #fdeee8 !important; color: var(--warn); }
  .steps { margin: 8px 0 0 20px; display: flex; flex-direction: column; gap: 6px; }
  .steps li { padding-left: 4px; }
  .steps .msg { margin: 4px 0 0; }
  #s-create { border-color: var(--accent); }

  /* 匯入相關 */
  .kept { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-radius: 8px; background: var(--panel); border: 1px dashed var(--accent); font-size: 13px; }
  .kept .txt { flex: 1; min-width: 200px; }
  .kept[hidden] { display: none; }
  input.has-f { background: #f6efff; border-color: #b9a2d9; }
  .badge { font-size: 11px; font-weight: 500; color: #fff; background: #8a6fb5; border-radius: 10px; padding: 1px 8px; cursor: help; }
  .badge[hidden] { display: none; }
  .sheet-box { background: var(--bg); border-radius: 12px; padding: 18px; width: min(460px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .sheet-box h3 { margin: 0 0 12px; color: var(--accent); }
  #sheetList { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  #sheetList button { width: 100%; text-align: left; border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  #sheetList button:hover { border-color: var(--accent); background: var(--accent-soft); }
  #sheetList span { color: var(--text-dim); font-size: 12px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200; }
  .toast.show { opacity: .92; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; padding: 12px 10px 80px; }
    nav.toc { position: static; flex-direction: row; overflow-x: auto; gap: 4px; }
    nav.toc a { white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; background: var(--panel); }
    .topbar { padding: 0 10px; }
    .topbar-sub, .btn .lbl { display: none; }
    .pk-body { grid-template-columns: 1fr; grid-template-rows: 1fr 45%; }
    .pk-list { border-right: 0; border-bottom: 1px solid var(--border); }
    .modal { padding: 0; }
    .picker { height: 100%; border-radius: 0; }
  }
  @media (max-width: 520px) {
    .slot { grid-template-columns: 50px 1fr; }
    .slot .note { grid-column: 1 / -1; }
  }
</style>
</head>

/* =====================================================================
   狀態：S[key] = 字串；另外 S['url:H80'] 記錄資源頁面網址、S['traits:H'] 記錄特性文字

let S = {};
function load() {
  try { S = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { S = {}; }
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }, 300);
}
const raw = k => (k in S ? S[k] : (DEFAULTS[k] ?? ''));
const n = k => { const v = parseFloat(raw(k)); return isFinite(v) ? v : 0; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =====================================================================
   計算（照「空白卡」公式）
   ===================================================================== */
const quotient = (a, b) => Math.trunc(a / b);
function lookup(v, keys, vals) {           // 試算表 LOOKUP：找 <= v 的最後一個
  let r = null;
  keys.forEach((k, i) => { if (v >= k) r = vals[i]; });
  return r;
}
let C = {};
function compute() {
  C = {};
  // 屬性：V 總和、X 傳屬、AD 附加成功
  ATTRS.forEach(a => {
    const V = ATTR_SRC.reduce((s, [c]) => s + n(c + a.r), 0);
    const X = quotient(V - 1, 5);
    C['V' + a.r] = V; C['X' + a.r] = X; C['AD' + a.r] = X + n('AA' + a.r);
  });
  const V = name => C['V' + ATTR_ROW[name]], X = name => C['X' + ATTR_ROW[name]], AD = name => C['AD' + ATTR_ROW[name]];

  // 技能：O 總和、S 附加成功
  SKILLS.forEach(s => {
    const O = SKILL_SRC.reduce((t, [c]) => t + n(c + s.r), 0);
    if (s.t === 'm') {
      if (O <= 0) { C['O' + s.r] = '無效'; C['S' + s.r] = 'X'; }
      else { C['O' + s.r] = O; const L = lookup(O, [1, 5, 7, 9, 11, 13, 15], [0, 1, 2, 3, 4, 5, 6]); C['S' + s.r] = L === null ? 'X' : L + n('Q' + s.r); }
    } else {
      C['O' + s.r] = O;
      const L = lookup(O, [0, 1, 5, 7, 9, 11, 13, 15], [s.t === 'p' ? -1 : -2, 0, 1, 2, 3, 4, 5, 6]);
      C['S' + s.r] = L === null ? 'X' : L + n('Q' + s.r);
    }
  });
  const O = r => C['O' + r], Sk = r => C['S' + r];

  // 建卡檢查（B15、B27）
  const F = ATTRS.map(a => n('F' + a.r));
  const fSum = F.reduce((a, b) => a + b, 0), fOver4 = F.filter(v => v > 4).length;
  if (fSum === 18) C.B15 = ['', '請在建卡欄位分配您的屬性(3+2+1/6)，單屬性上限為5，總和為30。'];
  else if (F.some(v => v > 5)) C.B15 = ['warn', '創角點數上限為5，請檢查。'];
  else if (fSum + fOver4 === 30) C.B15 = ['ok', '創卡屬性分配完成。'];
  else C.B15 = ['warn', '請在建卡欄位分配您的屬性(3+2+1/6)，單屬性上限為5，總和為30。剩餘點數：' + (30 - fSum - fOver4)];
  const G = SKILLS.map(s => n('G' + s.r));
  const gSum = G.reduce((a, b) => a + b, 0), gBonus = G.filter(v => v > 3).length + G.filter(v => v > 4).length;
  if (gSum === 0) C.B27 = ['', '請在建卡欄位分配您的技能(6+5+4/5)，單技能上限為5，總和為20。'];
  else if (G.some(v => v > 5)) C.B27 = ['warn', '創角技能上限為5，請檢查。'];
  else if (gSum + gBonus === 20) C.B27 = ['ok', '創卡技能分配完成。'];
  else C.B27 = ['warn', '請在建卡欄位分配您的技能(6+5+4/5)，單技能上限為5，總和為20。剩餘點數：' + (20 - gSum - gBonus)];

  // 衍生屬性：BP 基礎、BS 傳屬、BM 總值
  const size = raw('BM32');
  const bonus = r => BONUS.reduce((t, [c]) => t + n(c + r), 0);
  C.BP31 = n('BP31'); C.BS31 = 0;
  C.BP33 = V('力量') + V('敏捷') + (SIZE_SPEED[size] ?? 0); C.BS33 = 0;
  C.BM33 = C.BP33 + bonus(33);
  C.BP34 = C.BM33; C.BS34 = 0;
  C.BP35 = V('敏捷') + V('沉著'); C.BS35 = X('沉著') * 3;
  C.BP36 = V('感知'); C.BS36 = X('敏捷') + X('感知');
  C.BP37 = V('耐力') + (SIZE_HP[size] ?? 0); C.BS37 = (X('耐力') * X('耐力') + X('耐力')) / 2;
  C.BP38 = SIZE_REACH[size] ?? 0; C.BS38 = 0;
  C.BP39 = V('感知') * 10; C.BS39 = 20 * X('感知');
  C.BP40 = V('決心') + V('沉著'); C.BS40 = X('決心') * 3 + X('沉著') * 3;
  DERIVED.forEach(d => { if (d.r !== 33) C['BM' + d.r] = C['BP' + d.r] + C['BS' + d.r] + bonus(d.r); });

  // 豁免：BP 基礎、BM 總值、BR 附加成功
  const pos = v => (typeof v === 'number' && v > 0 ? v : 0);
  C.BP43 = V('決心') + O(49) + X('決心') * 3; C.BR43 = AD('決心') + n('BT43') + pos(Sk(49));
  C.BP44 = V('敏捷') + O(30) + X('敏捷') * 3; C.BR44 = AD('敏捷') + n('BT44') + pos(Sk(30));
  C.BP45 = V('耐力') + O(36) + X('耐力') * 3; C.BR45 = AD('耐力') + n('BT45') + pos(Sk(36));
  C.BP46 = V('決心') + V('沉著');             C.BR46 = AD('決心') + AD('沉著') + n('BT46');
  SAVES.forEach(s => { C['BM' + s.r] = C['BP' + s.r] + bonus(s.r); });

  // 檢定表：BA 有專業、BD 無專業、BG 附加
  CHECKS.forEach(c => {
    let attr = c.a;
    if (Array.isArray(attr)) attr = V(attr[0]) >= V(attr[1]) ? attr[0] : attr[1];
    C['AU' + c.r] = attr;
    const dp = n('AX' + c.r);
    if (c.expr) {
      const o = O(c.expr);
      C['BA' + c.r] = V('風度') + o + dp + 1; C['BD' + c.r] = V('風度') + o + dp; C['BG' + c.r] = '';
      return;
    }
    const sr = SKILL_ROW[c.k], o = O(sr), sa = Sk(sr);
    if (o === '無效') { C['BA' + c.r] = '無效'; C['BD' + c.r] = '無效'; C['BG' + c.r] = 'X'; return; }
    C['BA' + c.r] = V(attr) + o + dp + 1; C['BD' + c.r] = V(attr) + o + dp;
    C['BG' + c.r] = typeof sa === 'number' ? AD(attr) + sa : 'X';
  });

  // 缺陷、天賦點數
  C.BS2 = FLAW_ROWS.reduce((t, r) => t + n('BS' + r), 0);
  C.talentUsed = TALENT_ROWS.reduce((t, r) => t + n('CO' + r), 0);
  C.CO2 = Math.abs(C.BS2) / 2 - C.talentUsed;
  if (C.CO2 < 0) C.talentMsg = ['warn', `天賦點數超出 ${-C.CO2} 點：天賦可用點數為缺陷總等級的一半。`];
  else if (!C.BS2 && !C.talentUsed) C.talentMsg = ['', '可選擇缺陷來換取天賦點數（缺陷總等級 ÷ 2）。'];
  else C.talentMsg = ['ok', `天賦點數尚餘 ${C.CO2} 點。`];
  return C;
}

/* =====================================================================
   資源選擇器：讀左側目錄的資料（___left_data.js）
   ===================================================================== */
let TREE = null;
function getTree() {
  if (TREE) return TREE;
  const nodes = new Map();
  ((window.d && window.d.list) || []).forEach(([id, p, name, url]) => {
    nodes.set(id, { id, p, name, url: url && !url.startsWith('$$') ? url : '', kids: [] });
  });
  nodes.forEach(nd => { const p = nodes.get(nd.p); if (p) p.kids.push(nd.id); });
  const res = [...nodes.values()].find(nd => nd.name === '資源部分');
  const byName = {};
  if (res) res.kids.forEach(k => { byName[nodes.get(k).name] = k; });
  TREE = { nodes, res: res ? res.id : null, byName };
  return TREE;
}
async function loadTree() { return getTree(); }

// 依名稱找網站上的資源頁；找不到就視為原創資源
const normName = s => String(s).normalize('NFKC').toLowerCase().replace(/[\s·・‧\-－—_()（）\[\]【】「」『』〈〉《》:：,，.。'"!！?？~～]/g, '');
// loose：匯入時允許「名稱互相包含且只有一個符合」的比對（例如角卡寫簡稱）
// 也會比對分類資料夾（例如流派「鮮血議會」），以及「上層－名稱」的寫法（例如「星杯－鮮血議會」）
function matchResource(name, cats, loose = false) {
  const q = normName(name);
  if (!q) return null;
  const t = getTree();
  const roots = (cats || []).map(c => t.byName[c]).filter(v => v != null);
  const parts = String(name).split(/[－\-—–·・\/／>＞]+/).map(normName).filter(Boolean);
  const pick = list => list.find(nd => nd.url) || list[0];        // 同名時優先單頁
  const tryIn = (ids, loose) => {
    const all = nodesUnder(ids).map(id => t.nodes.get(id));
    let hits = all.filter(nd => nd.name === String(name).trim());
    if (!hits.length) hits = all.filter(nd => normName(nd.name) === q);
    if (hits.length) return pick(hits);
    if (parts.length > 1) {
      const last = parts[parts.length - 1], rest = parts.slice(0, -1);
      hits = all.filter(nd => normName(nd.name) === last && rest.every(p => normName(pathText(nd.id)).includes(p)));
      if (hits.length === 1) return hits[0];
    }
    if (!loose || q.length < 2) return null;
    hits = all.filter(nd => { const k = normName(nd.name); return k.length >= 2 && (k.includes(q) || q.includes(k)); });
    return hits.length === 1 ? hits[0] : null;
  };
  // 先在自己的分類找；找不到再到所有資源找，但只接受名稱完全相同的
  return (roots.length && tryIn(roots, loose)) || (t.res != null && tryIn([t.res], false)) || null;
}
// 資源的頁面：單頁就是本身；分類資料夾用它的「總綱」，沒有總綱就用第一頁
function nodeUrl(nd) {
  if (nd.url) return nd.url;
  const kids = nd.kids.map(k => TREE.nodes.get(k));
  const intro = kids.find(k => k.url && /總綱|概述|簡介/.test(k.name));
  if (intro) return intro.url;
  const first = leavesUnder([nd.id])[0];
  return first != null ? TREE.nodes.get(first).url : '';
}
const pk = {
  el: document.getElementById('picker'), list: document.getElementById('pkList'), prev: document.getElementById('pkPrev'),
  q: document.getElementById('pkQ'), all: document.getElementById('pkAll'), ok: document.getElementById('pkOk'), chosen: document.getElementById('pkChosen'),
  mode: 'browse', roots: [], path: [], sel: null, target: null,
};
function nodesUnder(ids) {           // 底下所有節點（不含 ids 本身）
  const out = [], walk = id => { TREE.nodes.get(id).kids.forEach(k => { out.push(k); walk(k); }); };
  ids.forEach(walk); return out;
}
function leavesUnder(ids) {
  const out = [], walk = id => { const nd = TREE.nodes.get(id); if (nd.url) out.push(id); nd.kids.forEach(walk); };
  ids.forEach(walk); return out;
}
function pathText(id, stop) {
  const a = []; let nd = TREE.nodes.get(TREE.nodes.get(id).p);
  while (nd && nd.id !== stop && nd.id !== TREE.res) { a.unshift(nd.name); nd = TREE.nodes.get(nd.p); }
  return a.join(' ／ ');
}
function scopeRoots() { return pk.all.checked ? [TREE.res] : pk.roots; }
function hl(text, term) {
  const i = term ? text.toLowerCase().indexOf(term) : -1;
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
}
function itemHTML(id, opts = {}) {
  const nd = TREE.nodes.get(id);
  if (nd.kids.length && !opts.leafOnly) {
    return `<li data-dir="${id}"><span class="ic">▸</span><span class="nm">${esc(nd.name)}</span><span class="c">${leavesUnder([id]).length}</span></li>`;
  }
  return `<li data-leaf="${id}" class="${pk.sel === id ? 'sel' : ''}"><span class="ic">${nd.url ? '•' : '▪'}</span><span class="nm">${hl(nd.name, opts.term)}${opts.path ? `<span class="p">${hl(opts.path, opts.term)}</span>` : ''}</span></li>`;
}
function pkRender() {
  if (pk.kind === 'list') return renderList();
  const roots = scopeRoots();
  const raw = pk.q.value.trim().toLowerCase(), words = raw.split(/\s+/).filter(Boolean);
  let html = '';
  if (words.length) {
    const hits = nodesUnder(roots).filter(id => {
      const nd = TREE.nodes.get(id), hay = (nd.name + ' ' + pathText(id)).toLowerCase();
      return words.every(w => hay.includes(w)) && (nd.url || nd.name.toLowerCase().includes(words[0]));
    });
    const term = words[0];
    hits.sort((a, b) => {
      const na = TREE.nodes.get(a).name.toLowerCase(), nb = TREE.nodes.get(b).name.toLowerCase();
      const ra = na === term ? 0 : na.startsWith(term) ? 1 : na.includes(term) ? 2 : 3;
      const rb = nb === term ? 0 : nb.startsWith(term) ? 1 : nb.includes(term) ? 2 : 3;
      return ra - rb;
    });
    html = `<div class="pk-info">找到 ${hits.length} 筆${hits.length > 300 ? '，先列出前 300 筆' : ''}</div>
      <ul class="pk-items">${hits.slice(0, 300).map(id => itemHTML(id, { leafOnly: true, path: pathText(id), term })).join('')}</ul>`;
  } else if (pk.mode === 'all') {
    const ids = leavesUnder(roots);
    html = `<div class="pk-info">共 ${ids.length} 筆</div><ul class="pk-items">${ids.map(id => itemHTML(id, { leafOnly: true, path: pathText(id) })).join('')}</ul>`;
  } else {
    // 分類瀏覽
    const top = roots.length === 1 ? roots[0] : null;
    const cur = pk.path.length ? pk.path[pk.path.length - 1] : top;
    const kids = cur === null ? roots : TREE.nodes.get(cur).kids;
    const crumbs = [`<a data-crumb="-1">${roots.map(r => esc(TREE.nodes.get(r).name)).join('、')}</a>`]
      .concat(pk.path.map((id, i) => ` ／ <a data-crumb="${i}">${esc(TREE.nodes.get(id).name)}</a>`));
    if (top !== null && !pk.path.length) crumbs.length = 1;
    // 進到某個資源資料夾裡時（例如某個流派），可以直接選整個分類
    const whole = cur !== null && !roots.includes(cur)
      ? `<li data-leaf="${cur}" class="whole ${pk.sel === cur ? 'sel' : ''}"><span class="ic">✓</span><span class="nm">選擇整個「${esc(TREE.nodes.get(cur).name)}」</span></li>` : '';
    html = `<div class="crumbs">${crumbs.join('')}</div><ul class="pk-items">${whole}${kids.map(id => itemHTML(id)).join('')}</ul>`;
  }
  pk.list.innerHTML = html;
  pk.list.scrollTop = 0;
}
async function openPicker(target, cats, title) {
  pk.el.classList.add('open'); pk.el.setAttribute('aria-hidden', 'false');
  pk.list.innerHTML = '<div class="pk-info">載入目錄中…</div>';

  pk.target = target; pk.sel = null; pk.path = []; pk.q.value = ''; pk.all.checked = false;
  pk.roots = cats.map(c => TREE.byName[c]).filter(v => v != null);
  if (!pk.roots.length) pk.roots = [TREE.res];

// 工作表清單：[{ name, path, hidden }]
async function listSheets(zip) {
  const wb = await zip.file('xl/workbook.xml').async('string');

  const out = [];

}
// 讀整張工作表：Map(ref → { v, t, f, fa, shared })
function parseSheet(xml, sst) {

  const cells = new Map();
  for (const c of doc.getElementsByTagNameNS(NS, 'c')) {
    const ref = c.getAttribute('r'), t = c.getAttribute('t') || 'n';
    const vEl = c.getElementsByTagNameNS(NS, 'v')[0], fEl = c.getElementsByTagNameNS(NS, 'f')[0];

      if (ft === 'shared' && !cell.f) cell.shared = true;   // Excel 共用公式的跟隨格：沒有公式文字

// （Google 試算表匯出的角卡沒有這個前綴；Google 試算表讀有前綴的也沒問題）
const xlfn = f => String(f).replace(/(^|[^\w.])(IFS|MAXIFS|MINIFS|SWITCH|TEXTJOIN|CONCAT|XLOOKUP|IFNA)\(/gi,

function cellXml(ref, style, spec) {

    const { v, fa } = spec;
    const f = spec.f == null || spec.f === '' ? spec.f : xlfn(spec.f);
    if (f != null && f !== '') {

      const vv = v === '' || v == null ? '' : `<v>${typeof v === 'boolean' ? (v ? 1 : 0) : xmlEsc(v)}</v>`;
      return `<c r="${ref}"${style}${tv}><f${fa || ''}>${xmlEsc(f)}</f>${vv}</c>`;
    }
    if (typeof v === 'boolean') return `<c r="${ref}"${style} t="b"><v>${v ? 1 : 0}</v></c>`;

function applyCells(xml, specs) {

function insertCell(xml, ref, cell) {
  const row = ref.match(/\d+$/)[0];

  if (!rm) {

  let newRow;
  if (rowXml.endsWith('/>')) newRow = rowXml.replace(/\/>$/, `>${cell}</row>`);
  else if (after) newRow = rowXml.replace(after[0], cell + after[0]);

const NAME_CELLS = new Set([...FLAW_ROWS.map(r => 'BU' + r), ...TALENT_ROWS.map(r => 'CQ' + r)]);

  let out = v === '' ? '' : full;

  // 找出角卡工作表（B2 是「角色名稱」），順便讀角色名稱
  const quick = (xml, ref) => {
    const m = xml.match(new RegExp(`<c r="${ref}"([^>]*?)(?:/>|>([\\s\\S]*?)</c>)`));
    if (!m || !m[2]) return '';
    const v = (m[2].match(/<v>([^<]*)<\/v>/) || [])[1] ?? (m[2].match(/<t[^>]*>([^<]*)<\/t>/) || [])[1] ?? '';
    return /t="s"/.test(m[1]) ? (sst[+v] ?? '') : v;
  };
  const cands = [];
  for (const s of sheets) {
    const f = zip.file(s.path); if (!f) continue;
    const xml = await f.async('string');
    if (quick(xml, 'B2').trim() === '角色名稱') cands.push({ ...s, xml, char: quick(xml, 'B3').trim() });
  }
  if (!cands.length) throw new Error('檔案裡找不到角色卡工作表（第 B2 格應為「角色名稱」）');
  const pickSheet = cands.length === 1 ? cands[0] : await chooseSheet(cands);
  if (!pickSheet) return;
  if (Object.keys(S).some(k => S[k] !== '' && !k.startsWith('url:')) &&
      !confirm(`要用「${pickSheet.name}」取代目前填寫的內容嗎？（建議先存檔）`)) return;

  const cells = parseSheet(pickSheet.xml, sst), tpl = await templateCells();
  const N = {}, formulaFields = [];
  // 1. 網頁有的欄位
  for (const [k, type] of Object.entries(FIELDS)) {
    const c = cells.get(k), tc = tpl.get(k);
    let v = cellStr(c);
    if (!v.trim()) v = '';
    // 樣板上的範例／提示文字不算玩家填的（例如「cm」「備註」「 -」）
    if (type === 't' && tc && !(k in DEFAULTS) && v.trim() === cellStr(tc).trim() && !(c && c.f)) {
      const lv = NAME_CELLS.has(k) ? cellStr(cells.get(k.replace(/^BU/, 'BS').replace(/^CQ/, 'CO'))).trim() : '';
      if (!lv) v = '';
    }
    if (type === 'n' && isNum(v)) v = String(+v);      // 2.0 → 2
    if (NAME_CELLS.has(k) && v.trim() === '-') v = '';
    if (NOTE_CELLS.has(k) && v.trim() === '備註') v = '';
    if (v !== '') N[k] = v; else if (k in DEFAULTS) N[k] = '';
    if (c && c.f && !c.shared) { N['f:' + k] = c.f; formulaFields.push(k); }
  }
  // 2. 其他和空白卡不同的格子：原樣保留
  const kept = [], overridden = [];
  S = N; compute();
  const computed = new Set(Object.keys(C).filter(k => /^[A-Z]+\d+$/.test(k)));
  for (const ref of new Set([...cells.keys(), ...tpl.keys()])) {
    if (ref in FIELDS) continue;
    const c = cells.get(ref) || { v: '' }, tc = tpl.get(ref) || { v: '' };
    if (sameCell(c, tc, ref)) continue;
    const keep = { v: c.v };
    if (c.f != null && !c.shared) { keep.f = c.f; if (c.fa) keep.fa = c.fa; }
    else if (c.t === 'n' && isNum(c.v)) keep.t = 'n';
    N['x:' + ref] = keep; kept.push(ref);
    if (computed.has(ref)) overridden.push(ref);
  }
  // 3. 強化能力：配對網站資源，找不到的就是原創
  const original = [];
  for (const k of Object.keys(ENH_CATS)) {
    if (!String(raw(k)).trim()) continue;
    autoLink(k, true);
    if (!S['url:' + k]) original.push(raw(k));
  }
  S['meta:import'] = JSON.stringify({ file: file.name, sheet: pickSheet.name, kept: kept.length, overridden, formulaFields, original });
  save(); fill(); show();
  showImportReport();
}
function showImportReport() {
  const info = S['meta:import'] ? JSON.parse(S['meta:import']) : null;
  if (!info) return;
  const lines = [`已匯入「${info.sheet}」（${info.file}）。`];
  if (info.original.length) lines.push(`\n● 原創資源（網站上找不到，照樣保留）：${info.original.join('、')}`);
  if (info.formulaFields.length) lines.push(`\n● ${info.formulaFields.length} 個欄位原本寫的是公式（以紫色標示，滑鼠移上去可看公式）。網頁顯示匯入時的結果，導出時保留公式：${info.formulaFields.join('、')}`);
  if (info.overridden.length) lines.push(`\n● 有 ${info.overridden.length} 個計算格被原角卡改過公式，網頁顯示的是標準算法，導出時會保留原角卡的公式：${info.overridden.join('、')}`);
  if (info.kept) lines.push(`\n● 另外保留了 ${info.kept} 格網頁還不能編輯的內容（能量池、攻擊、裝備、收支紀錄等），導出時原樣寫回。`);
  alert(lines.join('\n'));
}
function chooseSheet(cands) {
  return new Promise(resolve => {
    const m = document.getElementById('sheetPick'), list = document.getElementById('sheetList');
    list.innerHTML = cands.map((c, i) => `<li><button type="button" data-i="${i}"><b>${esc(c.name)}</b>
      <span>${c.char ? '角色：' + esc(c.char) : '（未填角色名稱）'}${c.hidden ? '・隱藏工作表' : ''}</span></button></li>`).join('');
    const done = v => { m.classList.remove('open'); list.onclick = null; document.getElementById('sheetCancel').onclick = null; resolve(v); };
    list.onclick = e => { const b = e.target.closest('button[data-i]'); if (b) done(cands[+b.dataset.i]); };
    document.getElementById('sheetCancel').onclick = () => done(null);
    m.classList.add('open');
  });
}
// 頁面上的「匯入資訊」提示
function refreshKept() {
  const box = document.getElementById('keptInfo');
  if (!box) return;
  const kept = Object.keys(S).filter(k => k.startsWith('x:')).length;
  const info = S['meta:import'] ? JSON.parse(S['meta:import']) : null;
  box.hidden = !info && !kept;
  if (box.hidden) return;
  box.querySelector('.txt').textContent = (info ? `匯入自「${info.sheet}」。` : '') +
    (kept ? `保留了 ${kept} 格網頁還不能編輯的原角卡內容，導出時會原樣寫回。` : '');
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name.replace(/[\\/:*?"<>|]/g, '_');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ----- 存檔／讀檔／清空 ----- */
document.getElementById('btnExport').onclick = exportXlsx;
document.getElementById('btnSave').onclick = () => {
  const blob = new Blob([JSON.stringify({ app: 'uh-charsheet', version: 1, data: S }, null, 1)], { type: 'application/json' });
  download(blob, (raw('B3').trim() || '角色卡') + '.json');
};
document.getElementById('btnLoad').onclick = () => document.getElementById('fileLoad').click();
document.getElementById('fileLoad').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const obj = JSON.parse(await file.text());
    if (!obj || obj.app !== 'uh-charsheet' || typeof obj.data !== 'object') throw new Error('不是角卡存檔');
    S = obj.data; save(); fill(); show();
    toast('已讀取：' + (raw('B3') || file.name));
  } catch (err) { alert('讀檔失敗：' + err.message); }
};
document.getElementById('btnClear').onclick = () => {
  if (!confirm('確定要清空所有欄位嗎？（建議先存檔）')) return;
  S = {}; save(); fill(); show();
};
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const btn = document.getElementById('btnImport');
  btn.disabled = true;
  try { await importXlsx(file); }
  catch (err) { console.error(err); alert('匯入失敗：' + err.message); }
  finally { btn.disabled = false; }
};
document.addEventListener('click', e => {
  if (e.target.closest('#keptReport')) showImportReport();
  if (e.target.closest('#keptClear')) {
    if (!confirm('清除後，導出時不會再寫回原角卡的能量池、攻擊、裝備、收支紀錄等內容，也不會保留欄位裡的公式。確定嗎？')) return;
    Object.keys(S).forEach(k => { if (k.startsWith('x:') || k.startsWith('f:') || k === 'meta:import') delete S[k]; });
    save(); fill(); show();
  }
});

/* ----- 建卡模式：只顯示建卡需要的欄位 ----- */
const MODE_KEY = 'uh-charsheet-create';
function setCreate(on) {
  document.body.classList.toggle('create', on);
  const b = document.getElementById('btnCreate');
  b.classList.toggle('primary', on); b.setAttribute('aria-pressed', on);
  try { localStorage.setItem(MODE_KEY, on ? '1' : ''); } catch (e) {}
}
document.getElementById('btnCreate').onclick = () => setCreate(!document.body.classList.contains('create'));

let toastTimer;
function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

load(); render(); fill(); show();
try { setCreate(localStorage.getItem(MODE_KEY) === '1'); } catch (e) { setCreate(false); }
// 給測試用
window.CS = { get S() { return S; }, set S(v) { S = v; fill(); show(); }, compute, FIELDS, exportValue, importXlsx, applyCells, matchResource };
})();
</script>
