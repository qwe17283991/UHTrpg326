<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目錄索引 - 無限流TRPG3.0</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

  /* ===== 變數設定（與 index.html 同步）===== */
  :root {
    --bg: #f0e8dc;
    --surface: #faf6f0;
    --accent: #c67b47;
    --accent-soft: #c67b4726;
    --accent-dim: #a8623a;
    --text: #4a3728;
    --text-dim: #9a8575;
    --border: #ddd0c0;
    --mark: #ffe08a;
  }
  body.dark {
    --bg: #161625;
    --surface: #0f0f1a;
    --accent: #e94560;
    --accent-soft: #e9456026;
    --accent-dim: #c73650;
    --text: #d8d8e8;
    --text-dim: #888;
    --border: #2a2a40;
    --mark: #6b5a1c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ===== 頂部工具列 ===== */
  .bar { flex-shrink: 0; padding: 10px 10px 8px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .search {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 2px solid var(--border); border-radius: 8px; padding: 0 10px;
    transition: border-color .2s;
  }
  .search:focus-within { border-color: var(--accent); }
  .search svg { flex: none; color: var(--text-dim); }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
    color: var(--text); font: inherit; font-size: 15px; padding: 8px 2px;
  }
  .search input::placeholder { color: var(--text-dim); }
  .clear { display: none; border: 0; background: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 0 2px; }
  .searching .clear { display: block; }
  .tools { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .btn {
    font: inherit; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--accent); border: 1px solid var(--accent); transition: background .2s;
  }
  .btn:hover { background: var(--accent-soft); }
  .stat { margin-left: auto; color: var(--text-dim); font-size: 12px; white-space: nowrap; }

  /* ===== 樹狀目錄 ===== */
  .scroll { flex: 1; overflow: auto; padding: 8px 6px 40px; }
  .tree ul { list-style: none; margin: 0 0 0 9px; padding-left: 10px; border-left: 1px solid var(--border); }
  .tree > ul { margin: 0; padding: 0; border: 0; }
  .tree summary { list-style: none; cursor: pointer; }
  .tree summary::-webkit-details-marker { display: none; }
  .row {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 6px; border-radius: 5px; color: var(--text); text-decoration: none;
    user-select: none;
  }
  .row:hover { background: var(--accent-soft); }
  .tree summary .row::before {
    content: ""; flex: none; width: 0; height: 0;
    border-left: 6px solid var(--text-dim); border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    transition: transform .15s;
  }
  .tree details[open] > summary .row::before { transform: rotate(90deg); }
  .leaf > .row { padding-left: 18px; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { color: var(--accent); text-decoration: underline; }
  .count { flex: none; color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }

  /* 頂層章節 */
  .tree > ul > li { margin-bottom: 6px; }
  .tree > ul > li > details > summary .row {
    font-weight: 700; font-size: 15px; color: var(--accent);
    background: var(--surface); border: 1px solid var(--border); padding: 6px 8px;
  }
  .tree > ul > li > details > ul { margin-top: 4px; }
  /* 第二層 */
  .tree > ul > li > details > ul > li > details > summary .row { font-weight: 500; }

  .row.current { background: var(--accent); color: #fff; }
  .row.current .count { color: #fff; }
  .row.current::before { border-left-color: #fff !important; }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 30% { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); } 100% { background: transparent; } }

  /* ===== 搜尋結果 ===== */
  #results { display: none; }
  .searching #results { display: block; }
  .searching .tree { display: none; }
  .rhead { color: var(--text-dim); font-size: 12px; margin: 2px 4px 8px; }
  .rlist { list-style: none; border-top: 1px solid var(--border); }
  .rlist li { border-bottom: 1px solid var(--border); }
  .rlist a {
    display: block; padding: 7px 8px; color: var(--text); text-decoration: none; cursor: pointer;
  }
  .rlist a:hover, .rlist a.sel { background: var(--accent-soft); }
  .rname { font-weight: 700; }
  .rpath { display: block; color: var(--text-dim); font-size: 12px; margin-top: 1px; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .empty { padding: 20px 6px; color: var(--text-dim); }

  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="bar" id="bar">
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="搜尋目錄，例如：寫輪眼、白刃" autocomplete="off" aria-label="搜尋目錄">
    <button class="clear" id="clear" type="button" aria-label="清除">✕</button>
  </label>
  <div class="tools">
    <button class="btn" id="openAll" type="button">全部展開</button>
    <button class="btn" id="closeAll" type="button">全部收合</button>
    <span class="stat" id="stat"></span>
  </div>
</div>

<div class="scroll" id="scroll">
  <section id="results" aria-live="polite"></section>
  <div class="tree" id="tree"></div>
</div>

<script type="text/javascript">
/* 目錄資料在 ___left_data.js（與角色卡共用） */
var d = { list: [], add: function (id, pid, name, url) { this.list.push([id, pid, name, url]); } };
</script>
<script src="___left_data.js"></script>
<script type="text/javascript">
(function () {
  var STORE = 'leftIndexState';
  var N = new Map();
  d.list.forEach(function (r) {
    var url = r[3] && r[3].indexOf('$$') !== 0 ? r[3] : '';
    N.set(r[0], { id: r[0], p: r[1], name: r[2], url: url, kids: [] });
  });
  var root = null;
  N.forEach(function (n) {
    if (N.has(n.p)) N.get(n.p).kids.push(n.id); else if (root === null) root = n.id;
  });
  function size(id) { return N.get(id).kids.reduce(function (s, k) { return s + 1 + size(k); }, 0); }
  N.forEach(function (n) { n.size = size(n.id); });
  function pathOf(id) {
    var a = [], n = N.get(id);
    while (N.has(n.p) && n.p !== root) { n = N.get(n.p); a.unshift(n.name); }
    return a;
  }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function href(url) { return encodeURIComponent(url); }

  var byUrl = {};
  N.forEach(function (n) { if (n.url && !(n.url in byUrl)) byUrl[n.url] = n.id; });
  var pages = 0; N.forEach(function (n) { if (n.url) pages++; });
  document.getElementById('stat').textContent = pages + ' 頁';

  /* ----- 狀態保存（展開的資料夾、捲動位置）----- */
  var state = { open: [], scroll: 0, cur: '' };
  try { var s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s) state = s; } catch (e) {}
  var openSet = new Set(state.open || []);
  function save() {
    try {
      state.open = Array.from(tree.querySelectorAll('details[open]')).map(function (el) { return +el.dataset.id; });
      state.scroll = scroller.scrollTop;
      localStorage.setItem(STORE, JSON.stringify(state));
    } catch (e) {}
  }

  /* ----- 建立樹 ----- */
  function rowHTML(n) {
    var label = n.url
      ? '<span class="name"><a href="' + href(n.url) + '" target="body" data-id="' + n.id + '" title="' + esc(n.name) + '">' + esc(n.name) + '</a></span>'
      : '<span class="name" title="' + esc(n.name) + '">' + esc(n.name) + '</span>';
    var extra = n.kids.length ? '<span class="count">' + n.size + '</span>' : '';
    return '<div class="row" id="r' + n.id + '">' + label + extra + '</div>';
  }
  function build(id) {
    var n = N.get(id);
    if (!n.kids.length) {
      return n.url
        ? '<li class="leaf"><a class="row" id="r' + n.id + '" href="' + href(n.url) + '" target="body" data-id="' + n.id + '" title="' + esc(n.name) + '"><span class="name">' + esc(n.name) + '</span></a></li>'
        : '<li class="leaf">' + rowHTML(n) + '</li>';
    }
    return '<li><details data-id="' + n.id + '"' + (openSet.has(n.id) ? ' open' : '') + '><summary>' + rowHTML(n) + '</summary><ul>' +
      n.kids.map(build).join('') + '</ul></details></li>';
  }
  var tree = document.getElementById('tree');
  var scroller = document.getElementById('scroll');
  tree.innerHTML = '<ul>' + N.get(root).kids.map(build).join('') + '</ul>';
  // 第一次使用時展開頂層章節
  if (!state.open || !state.open.length) N.get(root).kids.forEach(function (k) { tree.querySelector('details[data-id="' + k + '"]').open = true; });
  scroller.scrollTop = state.scroll || 0;
  tree.addEventListener('toggle', save, true);
  var st; scroller.addEventListener('scroll', function () { clearTimeout(st); st = setTimeout(save, 200); });

  /* ----- 目前頁面標示 ----- */
  var curEl = null;
  function markCurrent(id) {
    if (curEl) curEl.classList.remove('current');
    curEl = id == null ? null : document.getElementById('r' + id);
    if (curEl) curEl.classList.add('current');
  }
  function openParents(id) {
    var n = N.get(id);
    while (N.has(n.p)) { var el = tree.querySelector('details[data-id="' + n.p + '"]'); if (el) el.open = true; n = N.get(n.p); }
  }
  function reveal(id, openSelf) {
    clearSearch();
    openParents(id);
    var det = tree.querySelector('details[data-id="' + id + '"]');
    if (openSelf && det) det.open = true;
    var row = document.getElementById('r' + id);
    if (!row) return;
    row.scrollIntoView({ block: 'center' });
    row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
    save();
  }

  // 點擊頁面連結：標示目前頁面；資料夾本身的連結也順便展開
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-id]');
    if (!a) return;
    var id = +a.dataset.id;
    var det = tree.querySelector('details[data-id="' + id + '"]');
    if (det && a.closest('summary')) det.open = true;
    state.cur = N.get(id).url;
    markCurrent(id);
    if (a.closest('#results')) setTimeout(function () { reveal(id, false); }, 0);
    save();
  });

  // 與右側內容同步（站內連結跳頁時也會標示）
  function fileOf(loc) {
    try { return decodeURIComponent(loc.pathname.split('/').pop()); } catch (e) { return ''; }
  }
  function syncFromBody() {
    try {
      var f = fileOf(parent.frames['body'].location);
      if (f && f in byUrl) {
        var id = byUrl[f];
        if (!curEl || +curEl.id.slice(1) !== id) { state.cur = f; markCurrent(id); openParents(id); save(); }
      }
    } catch (e) {}
  }
  if (state.cur && state.cur in byUrl) markCurrent(byUrl[state.cur]);
  try {
    var bf = parent.document.getElementById('bodyFrame');
    if (bf) { bf.addEventListener('load', syncFromBody); syncFromBody(); }
    if (parent.document.body.classList.contains('dark')) document.body.classList.add('dark');
  } catch (e) {}

  document.getElementById('openAll').onclick = function () { clearSearch(); tree.querySelectorAll('details').forEach(function (el) { el.open = true; }); save(); };
  document.getElementById('closeAll').onclick = function () {
    clearSearch();
    tree.querySelectorAll('details').forEach(function (el) { el.open = false; });
    N.get(root).kids.forEach(function (k) { tree.querySelector('details[data-id="' + k + '"]').open = true; });
    scroller.scrollTop = 0; save();
  };

  /* ----- 搜尋 ----- */
  var q = document.getElementById('q'), results = document.getElementById('results');
  function norm(s) { return s.toLowerCase().replace(/\s+/g, ''); }
  var all = [];
  N.forEach(function (n) { if (n.id !== root) { n.key = norm(n.name); n.pkey = norm(pathOf(n.id).join('')); all.push(n); } });
  function hl(text, term) {
    var i = term ? text.toLowerCase().indexOf(term) : -1;
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
  }
  function clearSearch() { q.value = ''; document.body.classList.remove('searching'); }
  var timer;
  q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 80); });
  document.getElementById('clear').onclick = function () { clearSearch(); q.focus(); };
  function run() {
    var raw = q.value.trim(), term = norm(raw);
    if (!term) { document.body.classList.remove('searching'); return; }
    document.body.classList.add('searching');
    var words = raw.toLowerCase().split(/\s+/).filter(Boolean);
    var hits = all.filter(function (n) { return words.every(function (w) { return n.key.indexOf(w) >= 0 || n.pkey.indexOf(w) >= 0; }); });
    function rank(n) { return n.key === term ? 0 : n.key.indexOf(term) === 0 ? 1 : n.key.indexOf(term) >= 0 ? 2 : 3; }
    hits.sort(function (a, b) { return rank(a) - rank(b) || a.id - b.id; });
    if (!hits.length) {
      results.innerHTML = '<p class="empty">找不到含「' + esc(raw) + '」的條目。<br>試試較短的關鍵字，或用空格分開兩個詞，例如「改造 武器」。<br>要搜尋內文請用上方「全文搜尋」。</p>';
      return;
    }
    var shown = hits.slice(0, 200);
    results.innerHTML = '<p class="rhead">找到 ' + hits.length + ' 個條目' + (hits.length > 200 ? '，先列出前 200 個' : '') + '</p><ul class="rlist">' +
      shown.map(function (n) {
        var inner = '<span class="rname">' + hl(n.name, words[0]) + '</span>' + (n.kids.length ? ' <span class="count">' + n.size + ' 項</span>' : '') +
          '<span class="rpath">' + pathOf(n.id).map(function (p) { return hl(p, words[0]); }).join(' ／ ') + '</span>';
        return n.url
          ? '<li><a href="' + href(n.url) + '" target="body" data-id="' + n.id + '">' + inner + '</a></li>'
          : '<li><a data-folder="' + n.id + '" tabindex="0">' + inner + '</a></li>';
      }).join('') + '</ul>';
  }
  results.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-folder]');
    if (a) reveal(+a.dataset.folder, true);
  });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { clearSearch(); q.blur(); }
    if (e.key === 'Enter') { var a = results.querySelector('a'); if (a) a.click(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
})();
</script>
</body>
</html>
