# 推上 .htm 變更時，自動重建 search.json 與 search-index/ 並提交回 main
name: 重建搜尋索引

on:
  push:
    branches: [main]
    paths:
      - '**.htm'
      - '**.html'
      - '___left_data.js'
      - 'tools/build_search_index.py'
      - 'tools/build_charsheet.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-search-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install beautifulsoup4

      - run: python tools/build_search_index.py

      # 角色卡用的專長、怪癖、資源特性清單
      - run: python tools/build_charsheet.py --rules

      - name: 提交更新後的索引
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search.json search-index charsheet/rules.js charsheet/traitdesc.js
          # 只有 manifest.js 的版本號變動時不提交
          if git diff --cached --quiet -- search.json search-index/titles.js 'search-index/content-*.js' charsheet/rules.js charsheet/traitdesc.js; then
            echo "索引內容沒有變化，不需提交"
            exit 0
          fi
          git commit -m "自動更新搜尋索引"
          git pull --rebase -X theirs origin main
          git push
